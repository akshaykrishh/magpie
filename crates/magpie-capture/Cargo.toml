[package]
name = "magpie-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform capture backends: clipboard-watch and native selection-read"

[dependencies]
serde.workspace = true
thiserror.workspace = true
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-application-services = { version = "0.3", features = [
    "AXUIElement",
    "AXError",
    "HIServices",
    "libc",
] }
objc2-core-foundation = "0.3"
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation"] }
core-graphics = "0.25"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot"] }
async-io = "2"
percent-encoding = "2"

[dev-dependencies]
serial_test = "4"
tempfile = "3"
