name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # arboard needs a real X11/Wayland selection server to read/write the
      # clipboard, which a headless runner doesn't have on its own -- Xvfb
      # provides a virtual X server with the selection protocol built in, so
      # this exercises the real clipboard path rather than skipping it.
      - name: cargo test (Linux, under Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a cargo test --workspace

      - name: cargo test (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo test --workspace

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit

      # The accent-flip rule (styles/tokens.css's own doc comment, and the
      # redesign plan's stage 12): #3E7A92 is dark-grounds-only, #123A4B is
      # light-grounds-only, and neither should ever be hardcoded outside
      # tokens.css -- every other call site should flip via --mp-accent (or
      # index.css's --color-slate-teal/-light, themselves sourced from
      # tokens.css's fixed constants) instead. A literal hex anywhere else
      # is exactly the kind of thing that silently breaks one theme without
      # anyone noticing until someone happens to open the app in the other
      # one -- see Logo.tsx's fix for a real example this would have caught.
      - name: Guard against hardcoded accent hex outside tokens.css
        working-directory: apps/desktop/src
        run: |
          if grep -rn '3E7A92\|3e7a92\|123A4B\|123a4b' . --include='*.ts' --include='*.tsx' --include='*.css' --include='*.html' | grep -v '^styles/tokens.css'; then
            echo "::error::Hardcoded accent hex found outside styles/tokens.css -- use var(--mp-accent) (or tokens.css's --mp-accent-on-light/-on-dark for the rare fixed-color case) instead."
            exit 1
          fi

  build:
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Unsigned builds -- real code signing needs an Apple Developer ID
      # and is a manual step outside CI for now (see docs/design.md
      # "Signing"). The artifacts here are for build verification, not
      # distribution.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop

      # This is a Cargo workspace, so every member (including src-tauri)
      # shares one target/ directory at the repo root, not a per-crate one.
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
