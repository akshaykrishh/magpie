name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # arboard needs a real X11/Wayland selection server to read/write the
      # clipboard, which a headless runner doesn't have on its own -- Xvfb
      # provides a virtual X server with the selection protocol built in, so
      # this exercises the real clipboard path rather than skipping it.
      - name: cargo test (Linux, under Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a cargo test --workspace

      - name: cargo test (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo test --workspace

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit

  build:
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Unsigned builds -- real code signing needs an Apple Developer ID
      # and is a manual step outside CI for now (see docs/design.md
      # "Signing"). The artifacts here are for build verification, not
      # distribution.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop

      # This is a Cargo workspace, so every member (including src-tauri)
      # shares one target/ directory at the repo root, not a per-crate one.
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
