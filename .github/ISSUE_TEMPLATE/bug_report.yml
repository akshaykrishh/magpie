name: Bug report
description: Something isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If this is a **security vulnerability**,
        please don't file it here — see [SECURITY.md](https://github.com/akshaykrishh/magpie/blob/main/SECURITY.md)
        for private reporting instead.
  - type: input
    id: version
    attributes:
      label: magpie version
      description: Settings → About in the app, or `magpie --version` from the CLI.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Signed release (.dmg/.deb/.AppImage)
        - Unsigned CI build
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: >-
        The desktop app's Activity tab, or terminal output if you hit this through the
        `magpie` CLI, are good places to check first.
      render: shell
    validations:
      required: false
