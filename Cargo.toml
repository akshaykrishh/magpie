[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/magpie-core",
    "crates/magpie-capture",
    "crates/magpie-mcp",
    "crates/magpie-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/akshaykrishh/magpie"

[workspace.dependencies]
magpie-core = { path = "crates/magpie-core" }
magpie-capture = { path = "crates/magpie-capture" }
magpie-mcp = { path = "crates/magpie-mcp" }
tokio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
