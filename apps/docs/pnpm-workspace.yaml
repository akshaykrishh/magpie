allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security patches for transitive dependencies pulled in by next/eslint's
# own dependency trees -- see the Dependabot alerts these close.
overrides:
  postcss: 8.5.25
  sharp: 0.35.5
  fast-uri: 3.1.8
  compression: 1.8.2
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
